version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eers-backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://eers_admin:eers_local_pass_2026_db@mongo:27017/eers?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMTP_ENABLED=${SMTP_ENABLED:-true}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      - mongo
    networks:
      - eers-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: eers-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eers-network

  mongo:
    image: mongo:7
    container_name: eers-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-eers_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-eers_local_pass_2026_db}
    networks:
      - eers-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:

networks:
  eers-network:
    driver: bridge
